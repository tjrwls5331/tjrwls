<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>청운 | 함께 질문하고 성장하는 공간</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;600;700;800;900&display=swap');
:root{--navy:#102747;--blue:#2456a6;--sky:#eaf3ff;--ink:#182334;--muted:#718096;--line:#e6ebf2;--bg:#f5f7fb;--green:#13865b;--amber:#b7791f}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font-family:'Noto Sans KR',sans-serif}button,input,textarea,select{font:inherit}button{cursor:pointer;border:0}
#intro{position:fixed;inset:0;background:radial-gradient(circle at 50% 40%,#254b7e,#0b1b32 70%);display:flex;align-items:center;justify-content:center;z-index:20;color:white;animation:introOut .8s ease 2.8s forwards}
.intro-inner{text-align:center;animation:rise 1.2s ease both}.intro-symbol{width:76px;height:76px;border:1px solid #91b9ec;border-radius:24px;margin:0 auto 22px;display:grid;place-items:center;font-size:34px;color:#d8eaff;box-shadow:0 0 50px #76a9e955}.intro-title{font-size:clamp(58px,10vw,94px);font-weight:900;letter-spacing:14px;margin:0 0 14px}.intro-sub{letter-spacing:4px;font-size:11px;color:#b7cbe5}.intro-line{height:2px;width:0;background:#a9d0ff;margin:25px auto;animation:line 1s ease .6s forwards}
@keyframes rise{from{opacity:0;transform:translateY(25px);letter-spacing:24px}to{opacity:1;transform:translateY(0)}}@keyframes line{to{width:150px}}@keyframes introOut{to{opacity:0;visibility:hidden;pointer-events:none}} 
header{height:72px;background:white;border-bottom:1px solid var(--line);display:flex;align-items:center;justify-content:space-between;padding:0 max(5vw,22px);position:sticky;top:0;z-index:5}
.brand{display:flex;align-items:center;gap:12px;cursor:pointer}.brand-mark{width:42px;height:42px;border-radius:13px;background:var(--navy);color:white;display:grid;place-items:center;font-weight:900;font-size:19px;letter-spacing:1px}.brand-name{font-size:21px;font-weight:900;letter-spacing:3px;color:var(--navy)}.brand-sub{font-size:9px;color:#8b98a9;letter-spacing:1.2px;margin-top:1px}
.header-right{display:flex;align-items:center;gap:12px}.school-label{font-size:12px;color:#718096}.profile{background:#edf3fb;color:var(--navy);border-radius:30px;padding:9px 14px;font-size:12px;font-weight:700}
main{max-width:1120px;margin:36px auto;padding:0 22px}.hero{background:linear-gradient(115deg,#102747,#244f86);color:white;border-radius:22px;padding:32px 36px;display:flex;justify-content:space-between;align-items:center;overflow:hidden;position:relative;box-shadow:0 14px 35px #18385d1c}.hero:after{content:'靑';position:absolute;font-size:230px;font-weight:900;right:45px;top:-55px;color:#ffffff0b}.hero h1{font-size:28px;margin:0 0 9px;letter-spacing:-1px}.hero p{margin:0;color:#c7d8ed;font-size:13px;line-height:1.7}.hero-tag{font-size:11px;color:#cfe3ff;border:1px solid #ffffff40;border-radius:30px;padding:8px 13px;position:relative;z-index:1}
.toolbar{display:flex;justify-content:space-between;align-items:center;gap:12px;margin:30px 0 18px}.toolbar h2{font-size:20px;margin:0}.toolbar small{display:block;color:var(--muted);font-size:12px;margin-top:4px}.primary{background:var(--blue);color:white;border-radius:11px;padding:12px 17px;font-size:13px;font-weight:700;box-shadow:0 5px 14px #2456a626}.primary:hover{background:#194787}.filters{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:17px}.filter{background:white;border:1px solid var(--line);color:#64748b;border-radius:30px;padding:8px 14px;font-size:12px}.filter.active{background:var(--navy);border-color:var(--navy);color:white}
.search-row{display:flex;gap:9px;margin-bottom:18px}.search{flex:1;border:1px solid var(--line);border-radius:11px;background:white;padding:12px 15px;outline:none}.search:focus,input:focus,textarea:focus,select:focus{border-color:#7ba7df;box-shadow:0 0 0 3px #dceaff}
.list{display:grid;gap:11px}.post{background:white;border:1px solid var(--line);border-radius:15px;padding:18px 20px;display:grid;grid-template-columns:1fr auto;gap:14px;cursor:pointer;transition:.18s}.post:hover{transform:translateY(-2px);box-shadow:0 9px 25px #18385d0c;border-color:#cbd9ec}.post-title{font-weight:800;font-size:15px;margin:9px 0 7px}.post-desc{font-size:12px;color:#738196;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:690px}.meta{display:flex;gap:10px;align-items:center;color:#8a96a7;font-size:11px;flex-wrap:wrap}.subject{color:#315d96;background:#edf4ff;padding:5px 9px;border-radius:6px;font-weight:700}.status{align-self:start;border-radius:30px;padding:6px 10px;font-size:11px;font-weight:800;white-space:nowrap}.status.wait{background:#fff5df;color:#a56b12}.status.done{background:#e5f6ee;color:#128255}.post-right{display:flex;flex-direction:column;align-items:flex-end;justify-content:space-between;gap:15px}.reply-count{font-size:11px;color:#8a96a7}.empty{background:white;border:1px dashed #cbd5e1;border-radius:16px;padding:55px 20px;text-align:center;color:#8190a4}.empty strong{display:block;color:#334155;margin:12px 0 5px}.empty-icon{font-size:32px}
footer{text-align:center;color:#9aa5b4;font-size:10px;padding:40px 10px 28px}
.modal-back{position:fixed;inset:0;background:#0b1728a8;z-index:10;display:none;align-items:center;justify-content:center;padding:20px}.modal-back.show{display:flex}.modal{background:white;width:min(680px,100%);max-height:90vh;overflow:auto;border-radius:19px;padding:25px;box-shadow:0 25px 70px #0003}.modal-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:20px}.modal-head h3{margin:0;font-size:19px}.close{background:#f1f4f8;border-radius:9px;width:34px;height:34px;font-size:20px;color:#64748b}.field{margin:15px 0}.field label{display:block;font-size:12px;font-weight:800;margin-bottom:7px;color:#40516a}.field input,.field textarea,.field select{width:100%;border:1px solid #dce3ec;border-radius:10px;padding:12px;outline:none;background:white;font-size:13px}.field textarea{min-height:105px;resize:vertical}.hint{font-size:11px;color:#8995a5;margin-top:6px}.upload{display:block;border:1px dashed #b8c8dc;border-radius:12px;padding:18px;text-align:center;background:#f8fbff;color:#56708f;font-size:12px;cursor:pointer}.upload input{display:none}.preview{display:flex;gap:9px;flex-wrap:wrap;margin-top:10px}.preview img{width:100px;height:85px;object-fit:cover;border-radius:9px;border:1px solid var(--line)}
.detail-question{background:#f7f9fc;border-radius:13px;padding:17px;margin-bottom:18px}.detail-question h3{margin:10px 0;font-size:18px}.detail-question p{font-size:13px;line-height:1.7;white-space:pre-wrap}.detail-images{display:flex;gap:10px;flex-wrap:wrap}.detail-images img,.answer-images img{max-width:100%;width:auto;max-height:300px;object-fit:contain;border-radius:10px;border:1px solid var(--line)}
.answer{border:1px solid var(--line);border-radius:13px;padding:15px;margin:10px 0}.answer-top{display:flex;justify-content:space-between;color:#748196;font-size:11px}.answer p{font-size:13px;line-height:1.7;white-space:pre-wrap}.answer-images{display:flex;gap:9px;flex-wrap:wrap}.section-title{font-size:14px;font-weight:900;margin:22px 0 10px}.detail-actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:15px}.secondary{background:#edf2f8;color:#3c506c;border-radius:10px;padding:11px 14px;font-size:12px;font-weight:700}.success-btn{background:#e3f5ec;color:#117b51;border-radius:10px;padding:11px 14px;font-size:12px;font-weight:800}
#toast{position:fixed;bottom:24px;left:50%;transform:translateX(-50%);background:#152b49;color:white;padding:12px 18px;border-radius:30px;font-size:12px;opacity:0;pointer-events:none;transition:.25s;z-index:30}#toast.show{opacity:1}
@media(max-width:650px){header{padding:0 16px}.school-label{display:none}main{margin:22px auto;padding:0 14px}.hero{padding:25px 22px}.hero h1{font-size:22px}.hero-tag{display:none}.toolbar{align-items:flex-end}.post{padding:15px}.post-desc{max-width:230px}.brand-sub{font-size:8px}.modal{padding:19px}}
.brand-mark{background:transparent;border-radius:0;overflow:hidden}.brand-mark img{width:100%;height:100%;object-fit:contain}.intro-symbol{border:0;background:transparent;box-shadow:none;border-radius:0}.intro-symbol img{width:100%;height:100%;object-fit:contain}
</style>
</head>

function toast(s){$('toast').textContent=s;$('toast').classList.add('show');setTimeout(()=>$('toast').classList.remove('show'),2300)}
function ensureUser(){if(!user)editNickname(true);return !!user}
function editNickname(first=false){$('modal').innerHTML=`<div class="modal-head"><h3>닉네임 설정</h3><button class="close" onclick="closeModal()">×</button></div><div class="field"><label>게시판에서 사용할 닉네임</label><input id="nickInput" maxlength="16" placeholder="예: 청운수학러" value="${safe(user)}"><div class="hint">실명이나 학번 대신 별칭 사용을 권장합니다.</div></div><button class="primary" onclick="saveNickname()">저장하기</button>`;showModal();if(first)$('nickInput').focus()}
function saveNickname(){let v=$('nickInput').value.trim();if(!v)return toast('닉네임을 입력해 주세요.');user=v;localStorage.setItem(USERKEY,user);$('profileBtn').textContent='👤 '+user;closeModal();toast('닉네임이 저장되었습니다.')}
if(user)$('profileBtn').textContent='👤 '+user;
function showModal(){$('modalBack').classList.add('show')}function closeModal(){$('modalBack').classList.remove('show')}function backdropClose(e){if(e.target===$('modalBack'))closeModal()}
function goHome(){closeModal();window.scrollTo({top:0,behavior:'smooth'})}
function setFilter(f){filter=f;document.querySelectorAll('.filter').forEach(b=>b.classList.toggle('active',b.dataset.filter===f));renderPosts()}
$('filters').addEventListener('click',e=>{let b=e.target.closest('[data-filter]');if(b)setFilter(b.dataset.filter)});
function renderPosts(){let q=$('search').value.trim().toLowerCase(),sort=$('sort').value;let arr=posts.filter(p=>(filter==='all'||(filter==='done'?p.solved:!p.solved))&&(!q||(p.title+' '+p.subject+' '+p.desc).toLowerCase().includes(q)));arr.sort((a,b)=>sort==='old'?a.created-b.created:sort==='reply'?b.answers.length-a.answers.length:b.created-a.created);
$('postList').innerHTML=arr.length?arr.map(p=>`<article class="post" onclick="openDetail('${p.id}')"><div><div class="meta"><span class="subject">${safe(p.subject)}</span><span>${safe(p.author)}</span><span>${dateText(p.created)}</span></div><div class="post-title">${safe(p.title)}</div><div class="post-desc">${safe(p.desc||'문제 사진을 확인해 주세요.')}</div></div><div class="post-right"><span class="status ${p.solved?'done':'wait'}">${p.solved?'✓ 해결':'◷ 답변 중'}</span><span class="reply-count">답변 ${p.answers.length}개　›</span></div></article>`).join(''):`<div class="empty"><div class="empty-icon">✎</div><strong>${q?'검색 결과가 없습니다.':'아직 등록된 질문이 없습니다.'}</strong><span>첫 번째 질문을 올려 친구들과 함께 해결해 보세요.</span></div>`}
function fileToData(file){return new Promise((res,rej)=>{if(file.size>4*1024*1024)return rej(Error('이미지는 한 장당 4MB 이하로 올려 주세요.'));let r=new FileReader();r.onload=()=>res(r.result);r.onerror=rej;r.readAsDataURL(file)})}
async function readFiles(files,target,previewId){for(let f of [...files]){if(!f.type.startsWith('image/')){toast('이미지 파일만 첨부할 수 있습니다.');continue}try{target.push(await fileToData(f))}catch(e){toast(e.message)}}$(previewId).innerHTML=target.map((src,i)=>`<img src="${src}" alt="첨부 이미지 ${i+1}">`).join('')}
function openAsk(){if(!ensureUser())return;askImages=[];$('modal').innerHTML=`<div class="modal-head"><h3>새 질문 등록</h3><button class="close" onclick="closeModal()">×</button></div><div class="field"><label>과목</label><select id="askSubject"><option>수학</option><option>국어</option><option>영어</option><option>물리학</option><option>화학</option><option>생명과학</option><option>지구과학</option><option>정보</option><option>기타</option></select></div><div class="field"><label>질문 제목</label><input id="askTitle" maxlength="70" placeholder="어떤 부분이 궁금한가요?"></div><div class="field"><label>질문 설명</label><textarea id="askDesc" maxlength="1000" placeholder="문제에서 이해되지 않는 부분이나 시도한 풀이를 적어주세요."></textarea></div><div class="field"><label>문제 사진 첨부</label><label class="upload">＋ 사진 선택하기<input id="askFile" type="file" accept="image/*" multiple></label><div class="hint">이미지 최대 4MB · 여러 장 첨부 가능</div><div class="preview" id="askPreview"></div></div><button class="primary" onclick="submitAsk()">질문 게시하기</button>`;showModal();$('askFile').onchange=e=>readFiles(e.target.files,askImages,'askPreview')}
function submitAsk(){let title=$('askTitle').value.trim(),desc=$('askDesc').value.trim();if(title.length<6)return toast('질문 제목은 6글자 이상 입력해 주세요.');if(desc.length<6 && !askImages.length)return toast('질문 설명은 6글자 이상 입력하거나 사진을 첨부해 주세요.');posts.unshift({id:uid(),subject:$('askSubject').value,title,desc,images:askImages,author:user,owner:user,created:Date.now(),solved:false,answers:[]});save();sendToSheet($('askSubject').value,title,desc||'사진으로 등록된 질문입니다.').catch(()=>toast('시트 전송을 확인해 주세요.'));closeModal();setFilter('all');toast('질문이 게시되었습니다. 시트 저장은 별도로 확인해 주세요.')}
function openDetail(id){currentId=id;let p=posts.find(x=>x.id===id);if(!p)return;replyImages=[];$('modal').innerHTML=`<div class="modal-head"><h3>질문 상세</h3><button class="close" onclick="closeModal()">×</button></div><div class="detail-question"><div class="meta"><span class="subject">${safe(p.subject)}</span><span>${safe(p.author)}</span><span>${dateText(p.created)}</span><span class="status ${p.solved?'done':'wait'}">${p.solved?'✓ 해결':'◷ 답변 중'}</span></div><h3>${safe(p.title)}</h3><p>${safe(p.desc)}</p><div class="detail-images">${(p.images||[]).map(s=>`<img src="${s}" alt="질문 첨부 이미지">`).join('')}</div></div><div class="section-title">친구들의 풀이 · ${p.answers.length}</div><div id="answers">${p.answers.length?p.answers.map(a=>`<div class="answer"><div class="answer-top"><strong>${safe(a.author)}</strong><span>${dateText(a.created)}</span></div><p>${safe(a.text)}</p><div class="answer-images">${(a.images||[]).map(s=>`<img src="${s}" alt="풀이 첨부 이미지">`).join('')}</div></div>`).join(''):'<div class="empty" style="padding:25px">아직 등록된 풀이가 없습니다. 첫 번째 풀이를 공유해 보세요.</div>'}</div><div class="section-title">풀이 또는 설명 남기기</div><div class="field"><textarea id="replyText" placeholder="풀이 과정이나 설명을 자세히 적어주세요."></textarea></div><div class="field"><label class="upload">＋ 풀이 사진 첨부<input id="replyFile" type="file" accept="image/*" multiple></label><div class="hint">이미지 최대 4MB · 여러 장 첨부 가능</div><div class="preview" id="replyPreview"></div></div><button class="primary" onclick="submitReply()">풀이 등록하기</button><div class="detail-actions">${p.owner===user&&!p.solved?'<button class="success-btn" onclick="markSolved()">✓ 해결했어요</button>':''}${p.owner===user&&p.solved?'<button class="secondary" onclick="markUnsolved()">해결 상태 취소</button>':''}<button class="secondary" onclick="closeModal()">닫기</button></div>`;showModal();$('replyFile').onchange=e=>readFiles(e.target.files,replyImages,'replyPreview')}
function submitReply(){if(!ensureUser())return;let p=posts.find(x=>x.id===currentId),text=$('replyText').value.trim();if(text.length<6 && !replyImages.length)return toast('풀이 설명은 6글자 이상 입력하거나 사진을 첨부해 주세요.');p.answers.push({id:uid(),author:user,text,images:replyImages,created:Date.now()});save();sendToSheet('답변 · '+p.subject,p.title,text||'사진으로 등록된 답변입니다.').catch(()=>toast('시트 전송을 확인해 주세요.'));openDetail(currentId);toast('풀이가 등록되었습니다.')}
function markSolved(){let p=posts.find(x=>x.id===currentId);if(!p||p.owner!==user)return toast('질문 작성자만 변경할 수 있습니다.');p.solved=true;save();sendToSheet('해결 상태',p.title,'질문 해결 완료 상태').catch(()=>{});openDetail(currentId);renderPosts();toast('질문이 해결 상태로 변경되었습니다.')}
function markUnsolved(){let p=posts.find(x=>x.id===currentId);if(!p||p.owner!==user)return;p.solved=false;save();sendToSheet('해결 상태',p.title,'질문 답변 중으로 변경').catch(()=>{});openDetail(currentId);renderPosts();toast('질문 상태가 답변 중으로 변경되었습니다.')}
function setLogo(file){if(!file)return;if(!file.type.startsWith('image/'))return toast('이미지 파일을 선택해 주세요.');let r=new FileReader();r.onload=()=>{localStorage.setItem(LOGOKEY,r.result);applyLogo()};r.readAsDataURL(file)}
function applyLogo(){let logo=localStorage.getItem(LOGOKEY);if(logo)$('brandMark').innerHTML=`<img src="${logo}" style="width:100%;height:100%;object-fit:contain;border-radius:12px" alt="학교 교표">`}
applyLogo();
$('brandMark').addEventListener('click',e=>{e.stopPropagation();$('logoFile').click()});
$('logoFile').addEventListener('change',e=>setLogo(e.target.files[0]));
renderPosts();
</script>
</body>
</html>
